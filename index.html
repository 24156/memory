<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="description"
        content="لعبة الذاكرة – لعبة بطاقات متعددة اللاعبين. اعثر على جميع الأزواج في أقل وقت ممكن!" />
    <title>الذاكرة 🃏 – لعبة متعددة اللاعبين</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css?v=5" />
</head>

<body>

    <!-- الخلفية المتحركة -->
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- شاشة الإعداد -->
    <div class="setup-overlay" id="setupOverlay">
        <div class="setup-modal">
            <div class="setup-logo">
                <span class="setup-logo-icon">🃏</span>
                <h1 class="setup-title">الذاكرة</h1>
            </div>
            <!-- ✅ Resté en français comme demandé -->
            <p class="setup-desc">Jeu de cartes à retourner – Multijoueur</p>

            <!-- عدد اللاعبين -->
            <div class="setup-section">
                <label class="setup-label">
                    <span class="setup-label-icon">👥</span>
                    عدد اللاعبين
                </label>
                <div class="player-count-picker" id="playerPicker">
                    <button class="count-btn active" data-count="1" id="cnt1">١</button>
                    <button class="count-btn" data-count="2" id="cnt2">٢</button>
                    <button class="count-btn" data-count="3" id="cnt3">٣</button>
                    <button class="count-btn" data-count="4" id="cnt4">٤</button>
                    <button class="count-btn" data-count="5" id="cnt5">٥</button>
                    <button class="count-btn" data-count="6" id="cnt6">٦</button>
                </div>
            </div>

            <!-- أسماء اللاعبين -->
            <div class="setup-section">
                <label class="setup-label">
                    <span class="setup-label-icon">✏️</span>
                    أسماء اللاعبين
                </label>
                <div class="player-names" id="playerNames"></div>
            </div>

            <!-- مستوى الصعوبة -->
            <div class="setup-section">
                <label class="setup-label">
                    <span class="setup-label-icon">🎮</span>
                    مستوى الصعوبة
                </label>
                <div class="level-buttons" id="setupLevelBtns">
                    <button class="level-btn active" data-level="easy">
                        <span class="level-icon">🌱</span>
                        <span class="level-name">سهل</span>
                        <span class="level-desc">٨ أزواج</span>
                    </button>
                    <button class="level-btn" data-level="medium">
                        <span class="level-icon">🔥</span>
                        <span class="level-name">متوسط</span>
                        <span class="level-desc">١٢ زوجاً</span>
                    </button>
                    <button class="level-btn" data-level="hard">
                        <span class="level-icon">💀</span>
                        <span class="level-name">صعب</span>
                        <span class="level-desc">١٨ زوجاً</span>
                    </button>
                </div>
            </div>

            <button class="btn-start" id="btnStart">
                <span>🚀</span> ابدأ اللعبة
            </button>

            <p class="author-credit">✨ مشروع من تنفيذ <strong>Sidi Ahmed ElGhalawy</strong></p>
        </div>
    </div>

    <!-- شاشة اللعبة -->
    <div class="game-screen" id="gameScreen" style="display:none;">

        <header class="header">
            <div class="logo">
                <span class="logo-icon">🃏</span>
                <h1>لعبة الذاكرة</h1>
            </div>
        </header>

        <!-- شريط دور اللاعب -->
        <div class="turn-banner" id="turnBanner">
            <div class="turn-avatar" id="turnAvatar"></div>
            <div class="turn-info">
                <span class="turn-label">دور اللاعب</span>
                <span class="turn-name" id="turnName">لاعب ١</span>
            </div>
            <div class="turn-streak" id="turnStreak"></div>
        </div>

        <!-- نقاط اللاعبين -->
        <div class="players-bar" id="playersBar"></div>

        <!-- لوحة الإحصائيات -->
        <div class="dashboard">
            <div class="stat-card">
                <span class="stat-icon">🎯</span>
                <div class="stat-info">
                    <span class="stat-label">الحركات</span>
                    <span class="stat-value" id="movesCount">0</span>
                </div>
            </div>
            <div class="stat-card">
                <span class="stat-icon">⏱️</span>
                <div class="stat-info">
                    <span class="stat-label">الوقت</span>
                    <span class="stat-value" id="timerDisplay">00:00</span>
                </div>
            </div>
            <div class="stat-card">
                <span class="stat-icon">✅</span>
                <div class="stat-info">
                    <span class="stat-label">الأزواج</span>
                    <!-- ✅ Format en chiffres normaux comme demandé -->
                    <span class="stat-value" id="pairsCount">0 / 0</span>
                </div>
            </div>
        </div>

        <!-- شبكة البطاقات -->
        <main class="game-container">
            <div class="card-grid" id="cardGrid"></div>
        </main>

        <div class="controls">
            <button class="btn-replay" id="btnReplay">
                <span class="btn-icon">🏠</span>
                العودة للقائمة
            </button>
        </div>

        <footer class="game-footer">
            ✨ مشروع من تنفيذ <strong>Sidi Ahmed ElGhalawy</strong>
        </footer>

    </div>

    <!-- نافذة الفوز -->
    <div class="win-overlay" id="winOverlay">
        <div class="win-modal">
            <div class="win-confetti" id="confetti"></div>

            <div class="win-trophy" id="winTrophy">🏆</div>
            <h2 class="win-title" id="winTitle">تهانينا!</h2>
            <p class="win-sub" id="winSub">انتهت اللعبة!</p>

            <div class="podium" id="podium"></div>

            <div class="win-stats">
                <div class="win-stat">
                    <span class="win-stat-icon">⏱️</span>
                    <div>
                        <span class="win-stat-label">الوقت الكلي</span>
                        <span class="win-stat-value" id="winTime">00:00</span>
                    </div>
                </div>
                <div class="win-stat">
                    <span class="win-stat-icon">🎯</span>
                    <div>
                        <span class="win-stat-label">مجموع الحركات</span>
                        <span class="win-stat-value" id="winMoves">0</span>
                    </div>
                </div>
            </div>

            <div class="win-actions">
                <button class="btn-replay win-btn" id="btnWinReplay">
                    <span class="btn-icon">🔄</span> العب مجدداً
                </button>
                <button class="btn-replay win-btn btn-menu" id="btnWinMenu">
                    <span class="btn-icon">🏠</span> القائمة
                </button>
            </div>
        </div>
    </div>

    <script src="game.js?v=5"></script>
</body>

</html>
